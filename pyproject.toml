[project]
name = "influence-mapper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "atproto>=0.0.72",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "openai>=3.26.0",
    "pgvector>=0.5.0",
    "praw>=8.0.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "tweepy>=4.17.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["web/", "alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a Postgres database (TEST_DATABASE_URL)"]
